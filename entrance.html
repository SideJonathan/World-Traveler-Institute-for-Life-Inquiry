<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星球旅行者生命研究中心 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 淡化玉兰背景，同主页配置 */
            background: 
                linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("background.jpg") center / cover no-repeat fixed;
            /* 全局入场动画：淡入+去模糊 */
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
            filter: blur(2px);
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 内容容器 上浮渐入动画 */
        .login-wrap {
            text-align: center;
            animation: contentUp 1s 0.5s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes contentUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 主标题 */
        .main-title {
            font-size: 34px;
            color: #4a7c59;
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* 英文副标题 */
        .en-title {
            font-size: 18px;
            color: #73a679;
            letter-spacing: 1px;
            margin-bottom: 55px;
        }

        /* 登录按钮 */
        .login-btn {
            width: 300px;
            height: 68px;
            background-color: #5a9d6d;
            color: #ffffff;
            border: none;
            border-radius: 34px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(90, 157, 109, 0.15);
        }

        .login-btn:hover {
            background-color: #4a8c5b;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(90, 157, 109, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 26px;
            }
            .en-title {
                font-size: 15px;
            }
            .login-btn {
                width: 240px;
                height: 60px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="main-title">星球旅行者生命研究中心</div>
        <div class="en-title">World Traveler Institute for Life Inquiry</div>
        <button class="login-btn">账号登录</button>
    </div>

    <script>
        const loginBtn = document.querySelector('.login-btn');
        loginBtn.addEventListener('click', () => {
            // 点击可跳转到主页，按需修改路径
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
