<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面正在开发</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            /* 使用 background.jpg 作为背景 */
            background: url("background.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            position: relative;
            overflow-x: hidden;
            /* 入场动画：整体淡入 */
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
        }

        /* 页面淡入入场动画 */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 右上角Home按钮，和截图样式完全一致 */
        .home-btn-wrap {
            position: absolute;
            top: 28px;
            right: 32px;
            /* 按钮延迟浮现 */
            animation: elemFadeUp 1s ease-out 0.4s forwards;
            opacity: 0;
            transform: translateY(-12px);
        }
        .home-btn {
            display: inline-block;
            padding: 10px 28px;
            background-color: #346b48;
            color: #ffffff;
            border: 2px solid #224731;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        .home-btn:hover {
            background-color: #29573a;
        }

        /* 页面垂直水平居中主体 */
        .center-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap:12px;
            /* 中间文字延迟上浮淡入 */
            animation: elemFadeUp 1s ease-out 0.6s forwards;
            opacity: 0;
            transform: translateY(16px);
        }
        .center-content h1 {
            font-size: 34px;
            color:#2c4436;
            font-weight:500;
        }
        .center-content p {
            font-size: 20px;
            color:#4a6456;
        }

        /* 底部版权，和截图版权文本完全相同 */
        .footer-copyright {
            position: absolute;
            width: 100%;
            bottom:36px;
            text-align: center;
            font-size: 15px;
            color:#5c7467;
            /* 版权最晚出现 */
            animation: elemFadeUp 1s ease-out 0.8s forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        /* 元素上浮淡入通用动画 */
        @keyframes elemFadeUp {
            to {
                opacity:1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media(max-width:720px){
            .home-btn-wrap {
                right:20px;
                top:20px;
            }
            .home-btn {
                padding: 8px 18px;
                font-size:14px;
            }
            .center-content h1 {
                font-size:26px;
            }
            .center-content p {
                font-size:17px;
            }
        }
    </style>
</head>
<body>
    <div class="home-btn-wrap">
        <a href="index home.html" class="home-btn">Home</a>
    </div>

    <!-- 居中开发提示文字 -->
    <div class="center-content">
        <h1>该页面正在开发</h1>
        <p>敬请期待</p>
    </div>

    <!-- 底部版权，和截图完全一致 -->
    <div class="footer-copyright">© World Traveler Institute for Life Inquiry, 2026</div>
</body>
</html>
