<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星球旅行者生命研究中心 - 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            user-select: none;
            -webkit-user-select: none;
        }

        /* 页面入场动画 + 淡化实景背景 */
        body {
            min-height: 100vh;
            display: flex;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("background.jpg") center / cover no-repeat fixed;
            background-color: #f5faf5;
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
            filter: blur(2px);
        }

        /* 整体淡入动画 */
        @keyframes pageFadeIn {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 左侧导航栏：滑入动画 */
        .sidebar {
            width: 240px;
            height: 100vh;
            background-color: rgba(90, 157, 109, 0.85);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 60px 20px;
            position: fixed;
            display: flex;
            flex-direction: column;
            animation: sidebarSlide 0.8s 0.4s ease-out forwards;
            transform: translateX(-100%);
            opacity: 0;
        }

        @keyframes sidebarSlide {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .nav-list {
            list-style: none;
            flex: 1;
        }

        .nav-list li {
            margin-bottom: 16px;
            position: relative;
        }

        .nav-list a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            padding: 14px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-list a:hover {
            background-color: rgba(255,255,255,0.2);
            padding-left: 24px;
        }

        .nav-list a.active {
            background-color: rgba(255,255,255,0.25);
        }

        /* 导航栏柔和NEW、dot角标 */
        .new-badge {
            position: absolute;
            right: 14px;
            top: 12px;
            background-color: #d96464;
            color: #fff8f8;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }
        .dot-badge {
            position: absolute;
            right: 16px;
            top: 18px;
            width: 9px;
            height: 9px;
            background-color: #d96464;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }
        /* 新增：页面内低对比度信息提示栏 */
        .info-notice {
            background-color: rgba(90, 157, 109, 0.12);
            border: 1px solid rgba(90, 157, 109, 0.22);
            border-radius: 10px;
            padding: 16px 22px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .info-title {
            font-size: 18px;
            color: #4a7c59;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-new-tag {
            background-color: #d96464;
            color: #fff8f8;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 8px;
        }
        .info-tip {
            font-size: 14px;
            color: #698c74;
            margin-left: 8px;
        }

        /* 版权信息 */
        .copyright {
            color: #e8f1e9;
            font-size: 13px;
            text-align: center;
            padding-top: 30px;
            line-height: 1.6;
            border-top: 1px solid rgba(255,255,255,0.2);
            animation: copyrightFade 1s 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes copyrightFade {
            to { opacity: 1; }
        }

        /* 主内容区：上浮动画 */
        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 60px 80px;
            animation: contentUp 1s 0.6s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes contentUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .page-title {
            font-size: 36px;
            color: #4a7c59;
            margin-bottom: 30px;
        }

        .content-desc {
            font-size: 16px;
            color: #555;
            line-height: 2;
            max-width: 800px;
            margin-bottom: 35px;
        }

        /* 退出登录按钮 —— 柔和低对比红色样式 */
        .logout-btn {
            padding: 12px 32px;
            background-color: #fdf6f6;
            border: 1px solid #d47878;
            color: #b95858;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background-color: #fbeaea;
            border-color: #c75c5c;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar { width: 180px; }
            .main-content { margin-left: 180px; padding: 40px 30px; }
            .page-title { font-size: 28px; }
            .new-badge {
                right: 8px;
                font-size: 10px;
                padding: 1px 4px;
                background-color: #ce5c5c;
            }
            .dot-badge {
                right: 10px;
                width: 7px;
                height: 7px;
            }
            .info-notice {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            .info-title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- 左侧导航 -->
    <aside class="sidebar">
        <ul class="nav-list">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="index a.html">生命科学研究资料</a></li>
            <li>
                <a href="index b.html">星球旅行者生命月刊</a>
                <span class="dot-badge"></span>
            </li>
            <li><a href="index c.html">关于我们</a></li>
        </ul>
        <div class="copyright">
            © World Traveler Institute for Life Inquiry<br>
            2026
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
        <h1 class="page-title">欢迎来到星球旅行者生命研究中心</h1>
        <p class="content-desc">
            太虚寥廓，星汉垂文；乾坤化育，生命流芳。自鸿蒙肇始，万象萌生，星河载天地之灵，众生蕴造化之奇。今星旅生命研究中心轩门大开，恭迎四方雅士。纵目则星河漫卷，凝神则灵息深藏。于此穷究生灭之理，辨析形神之妙，探寰宇生灵之脉络，悟自然运化之真机。愿同执求索之炬，踏遍星海，深究生命大道，共览万古生机。
        </p>

        <!-- 新增低对比度信息栏：文字下方、退出按钮上方 -->
        <div class="info-notice">
            <div class="info-title">
                星球旅行者生命月刊
                <span class="info-new-tag">NEW</span>
            </div>
            <span class="info-tip">开发中，敬请期待</span>
        </div>

        <!-- 退出登录按钮 -->
        <button class="logout-btn" id="logout">退出登录</button>
    </main>

    <script>
        // 退出登录，返回登录页
        const logoutBtn = document.getElementById('logout');
        logoutBtn.addEventListener('click', function(){
            if(confirm('确定要退出当前登录吗？')){
                window.location.href = "login.html";
            }
        });
    </script>
    <script>
    // 设备识别函数：手机判定，iPad视为电脑
    function isMobileDevice() {
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) && !/iPad/i.test(ua);
        const smallScreen = window.innerWidth <= 768;
        return isMobileUA || smallScreen;
    }
    
    window.addEventListener('load', function () {
        const skipMobileTip = localStorage.getItem('skipMobileTip');
        // 不是手机 或者 已经标记不再提示 → 不执行
        if (!isMobileDevice() || skipMobileTip === 'true') return;
    
        // 创建强制弹窗，无关闭按钮
        const mask = document.createElement('div');
        mask.style = `
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99999;
        `;
        const box = document.createElement('div');
        box.style = `background:#fff;padding:26px;border-radius:12px;width:330px;text-align:center`;
        box.innerHTML = `
            <h3 style="margin:0 0 14px;color:#4a7c59">检测到移动设备访问</h3>
            <p style="margin:0 0 16px;color:#555">当前页面仅适配电脑端，请切换至移动端专用页面浏览</p>
            <label style="display:flex;gap:6px;margin:0 auto 20px;width:fit-content;">
                <input type="checkbox" id="noRemind">本次设备后续不再提醒
            </label>
            <button id="goMobile" style="padding:8px 22px;background:#4a7c59;color:#fff;border:none;border-radius:6px;font-size:16px">前往移动端页面</button>
        `;
        mask.appendChild(box);
        document.body.appendChild(mask);
    
        // 按钮点击事件
        document.querySelector('#goMobile').onclick = function () {
            const checkbox = document.querySelector('#noRemind');
            if (checkbox.checked) {
                localStorage.setItem('skipMobileTip', 'true');
            }
            // 替换为你的移动端网页地址
            window.location.href = "mobile.html";
        }
    
        // 禁止点击遮罩关闭弹窗
        mask.onclick = function(e){
            if(e.target === mask) e.stopPropagation();
        }
    });
    </script>
    <script>
    // 1. 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    
    // 2. 禁止选中文字
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
    
    // 3. 拦截快捷键
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+U
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.key === 'u') {
            e.preventDefault();
            return false;
        }
        // Ctrl+s 保存页面（可选拦截）
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
        }
    });
            (function() {
        let devOpen = false;
        const threshold = 160;
        setInterval(() => {
            const width = window.outerWidth - window.innerWidth;
            const height = window.outerHeight - window.innerHeight;
            if (width > threshold || height > threshold) {
                if (!devOpen) {
                    devOpen = true;
                    const userSure = confirm("请勿打开开发者工具");
                    if(userSure) location.reload();
                }
            } else {
                devOpen = false;
            }
        }, 500);
    })();
    </script>
</body>
</html>
