<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星球旅行者生命研究中心 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        /* 页面整体样式 + 统一淡化背景 + 入场动画 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("background.jpg") center / cover no-repeat fixed;
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
            filter: blur(2px);
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 登录容器：上浮渐入动画 */
        .login-box {
            width: 420px;
            padding: 50px 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(74, 124, 89, 0.15);
            text-align: center;
            animation: contentUp 1s 0.5s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes contentUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 机构标题 */
        .title {
            font-size: 30px;
            color: #4a7c59;
            margin-bottom: 8px;
        }

        .en-title {
            font-size: 16px;
            color: #73a679;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* 输入框样式 */
        .input-item {
            margin-bottom: 20px;
        }

        .input-item input {
            width: 100%;
            height: 52px;
            padding: 0 20px;
            border: 1px solid #c8dccb;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #fff;
            transition: border 0.3s ease;
        }

        .input-item input:focus {
            outline: none;
            border-color: #5a9d6d;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 52px;
            margin-top: 10px;
            background-color: #5a9d6d;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: #4a8c5b;
            box-shadow: 0 4px 12px rgba(90, 157, 109, 0.2);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .login-box {
                width: 90%;
                padding: 35px 25px;
            }
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="title">星球旅行者生命研究中心</h2>
        <p class="en-title">World Traveler Institute for Life Inquiry</p>

        <div class="input-item">
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="input-item">
            <input type="password" id="pwd" placeholder="请输入密码">
        </div>

        <button class="login-btn" id="loginBtn">账号登录</button>
    </div>

    <script>
        // 预设合法账号密码
        const userList = [
            { user: "World Traveler 01", pwd: "World Traveler 01 123456" },
            { user: "World Traveler 02", pwd: "World Traveler 02 123456" },
            { user: "World Traveler 03", pwd: "World Traveler 03 123456" }
        ];

        const username = document.getElementById('username');
        const pwd = document.getElementById('pwd');
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.addEventListener('click', function () {
            const u = username.value.trim();
            const p = pwd.value.trim();

            // 校验账号密码
            const isSuccess = userList.some(item => item.user === u && item.pwd === p);

            if (isSuccess) {
                alert("登录成功，正在跳转...");
                // 跳转到主页
                window.location.href = "index.html";
            } else {
                alert("账号或密码错误，请重新输入！");
                // 清空输入框并聚焦账号
                username.value = "";
                pwd.value = "";
                username.focus();
            }
        });
    </script>
</body>
</html>
