<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星球旅行者生命研究中心 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        /* 页面整体样式 + 统一淡化背景 + 入场动画 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("background.jpg") center / cover no-repeat fixed;
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
            filter: blur(2px);
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 登录容器：上浮渐入动画 */
        .login-box {
            width: 420px;
            padding: 50px 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(74, 124, 89, 0.15);
            text-align: center;
            animation: contentUp 1s 0.5s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes contentUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 机构标题 */
        .title {
            font-size: 30px;
            color: #4a7c59;
            margin-bottom: 8px;
        }

        .en-title {
            font-size: 16px;
            color: #73a679;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* 输入框样式 */
        .input-item {
            margin-bottom: 20px;
        }

        .input-item input {
            width: 100%;
            height: 52px;
            padding: 0 20px;
            border: 1px solid #c8dccb;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #fff;
            transition: border 0.3s ease;
        }

        .input-item input:focus {
            outline: none;
            border-color: #5a9d6d;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 52px;
            margin-top: 10px;
            background-color: #5a9d6d;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: #4a8c5b;
            box-shadow: 0 4px 12px rgba(90, 157, 109, 0.2);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .login-box {
                width: 90%;
                padding: 35px 25px;
            }
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="title">星球旅行者生命研究中心</h2>
        <p class="en-title">World Traveler Institute for Life Inquiry</p>

        <div class="input-item">
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="input-item">
            <input type="password" id="pwd" placeholder="请输入密码">
        </div>

        <button class="login-btn" id="loginBtn">账号登录</button>
    </div>

    <script>
        // 预设合法账号密码
        const userList = [
            { user: "World Traveler 01", pwd: "World Traveler 01 123456" },
            { user: "World Traveler 02", pwd: "World Traveler 02 123456" },
            { user: "World Traveler 03", pwd: "World Traveler 03 123456" }
        ];

        const username = document.getElementById('username');
        const pwd = document.getElementById('pwd');
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.addEventListener('click', function () {
            const u = username.value.trim();
            const p = pwd.value.trim();

            // 校验账号密码
            const isSuccess = userList.some(item => item.user === u && item.pwd === p);

            if (isSuccess) {
                alert("登录成功，正在跳转...");
                // 跳转到主页
                window.location.href = "index home.html";
            } else {
                alert("账号或密码错误，请重新输入！");
                // 清空输入框并聚焦账号
                username.value = "";
                pwd.value = "";
                username.focus();
            }
        });
    </script>
        <script>
    // 设备识别函数：手机判定，iPad视为电脑
    function isMobileDevice() {
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) && !/iPad/i.test(ua);
        const smallScreen = window.innerWidth <= 768;
        return isMobileUA || smallScreen;
    }
    
    window.addEventListener('load', function () {
        const skipMobileTip = localStorage.getItem('skipMobileTip');
        // 不是手机 或者 已经标记不再提示 → 执行
        if (isMobileDevice()) {
            if(skipMobileTip === 'true'){
                window.location.href = "index mobile.html";
                return;
            }
            // 执行弹窗逻辑
    
        // 创建强制弹窗，无关闭按钮
        const mask = document.createElement('div');
        mask.style = `
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99999;
        `;
        const box = document.createElement('div');
        box.style = `background:#fff;padding:26px;border-radius:12px;width:330px;text-align:center`;
        box.innerHTML = `
            <h3 style="margin:0 0 14px;color:#4a7c59">检测到移动设备访问</h3>
            <p style="margin:0 0 16px;color:#555">当前页面仅适配电脑端，请切换至移动端专用页面浏览</p>
            <label style="display:flex;gap:6px;margin:0 auto 20px;width:fit-content;">
                <input type="checkbox" id="noRemind">本设备后续不再提醒
            </label>
            <button id="goMobile" style="padding:8px 22px;background:#4a7c59;color:#fff;border:none;border-radius:6px;font-size:16px">前往移动端页面</button>
        `;
        mask.appendChild(box);
        document.body.appendChild(mask);
    
        // 按钮点击事件
        document.querySelector('#goMobile').onclick = function () {
            const checkbox = document.querySelector('#noRemind');
            if (checkbox.checked) {
                localStorage.setItem('skipMobileTip', 'true');
            }
            // 替换为你的移动端网页地址
            window.location.href = "index mobile.html";
        }
    
        // 禁止点击遮罩关闭弹窗
        mask.onclick = function(e){
            if(e.target === mask) e.stopPropagation();
        }
        }
    });
    </script>
    <script>
    // 1. 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    
    // 2. 禁止选中文字
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
    
    // 3. 拦截快捷键
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+U
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.key === 'u') {
            e.preventDefault();
            return false;
        }
        // Ctrl+s 保存页面（可选拦截）
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
        }
    });
        
    (function() {
        // ========== 配置区 ==========
        const ADMIN_PASSWORD = "WTILI"; 
        const CHECK_INTERVAL = 500;
        let devOpen = false;
        let isAdminVerified = false; // 管理员验证标记，验证通过后不再检测
    
        // 检测开发者工具
        function checkDevTools() {
            if(isAdminVerified) return; // 已经管理员验证，不再检测
    
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            const opened = widthDiff > threshold || heightDiff > threshold;
    
            if(opened && !devOpen){
                devOpen = true;
                // 原生confirm弹窗：确定 / 取消
                const res = confirm("检测到开发者工具已打开，请关闭后继续浏览！");
                if(res){
                    // 点击确定：刷新页面
                    location.reload();
                }else{
                    // 点击取消：请求管理员密码
                    const inputPwd = prompt("请输入管理员密码");
                    if(inputPwd === ADMIN_PASSWORD){
                        // 密码正确：关闭弹窗，停止检测
                        isAdminVerified = true;
                    }else{
                        // 密码错误：刷新页面
                        alert("密码错误");
                    location.reload();
                    }
                }
            }else if(!opened){
                devOpen = false;
            }
        }
    
        // 拦截快捷键 F12 / Ctrl+Shift+I / Ctrl+U
        document.addEventListener("keydown",function(e){
            if(isAdminVerified) return;
            if(e.key === "F12"){
                e.preventDefault();
                checkDevTools();
            }
            if(e.ctrlKey && e.shiftKey && ["I","i"].includes(e.key)){
                e.preventDefault();
                checkDevTools();
            }
            if(e.ctrlKey && ["U","u"].includes(e.key)){
                e.preventDefault();
            }
        })
    
    // 定时循环检测
        setInterval(checkDevTools, CHECK_INTERVAL);
    })();
    </script>
</body>
</html>
