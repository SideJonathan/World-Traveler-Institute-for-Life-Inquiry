<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星球旅行者生命研究中心 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 淡化玉兰背景，同主页配置 */
            background: 
                linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("background.jpg") center / cover no-repeat fixed;
            /* 全局入场动画：淡入+去模糊 */
            animation: pageFadeIn 1.2s ease-out forwards;
            opacity: 0;
            filter: blur(2px);
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 内容容器 上浮渐入动画 */
        .login-wrap {
            text-align: center;
            animation: contentUp 1s 0.5s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes contentUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 主标题 */
        .main-title {
            font-size: 34px;
            color: #4a7c59;
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* 英文副标题 */
        .en-title {
            font-size: 18px;
            color: #73a679;
            letter-spacing: 1px;
            margin-bottom: 55px;
        }

        /* 登录按钮 */
        .login-btn {
            width: 300px;
            height: 68px;
            background-color: #5a9d6d;
            color: #ffffff;
            border: none;
            border-radius: 34px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(90, 157, 109, 0.15);
        }

        .login-btn:hover {
            background-color: #4a8c5b;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(90, 157, 109, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 26px;
            }
            .en-title {
                font-size: 15px;
            }
            .login-btn {
                width: 240px;
                height: 60px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="main-title">星球旅行者生命研究中心</div>
        <div class="en-title">World Traveler Institute for Life Inquiry</div>
        <button class="login-btn">账号登录</button>
    </div>

    <script>
        const loginBtn = document.querySelector('.login-btn');
        loginBtn.addEventListener('click', () => {
            // 点击可跳转到主页，按需修改路径
            window.location.href = "login.html";
        });
    </script>
        <script>
    // 设备识别函数：手机判定，iPad视为电脑
    function isMobileDevice() {
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) && !/iPad/i.test(ua);
        const smallScreen = window.innerWidth <= 768;
        return isMobileUA || smallScreen;
    }
    
    window.addEventListener('load', function () {
        const skipMobileTip = localStorage.getItem('skipMobileTip');
        // 不是手机 或者 已经标记不再提示 → 执行
        if (isMobileDevice()) {
            if(skipMobileTip === 'true'){
                window.location.href = "index mobile.html";
                return;
            }
            // 执行弹窗逻辑
    
        // 创建强制弹窗，无关闭按钮
        const mask = document.createElement('div');
        mask.style = `
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99999;
        `;
        const box = document.createElement('div');
        box.style = `background:#fff;padding:26px;border-radius:12px;width:330px;text-align:center`;
        box.innerHTML = `
            <h3 style="margin:0 0 14px;color:#4a7c59">检测到移动设备访问</h3>
            <p style="margin:0 0 16px;color:#555">当前页面仅适配电脑端，请切换至移动端专用页面浏览</p>
            <label style="display:flex;gap:6px;margin:0 auto 20px;width:fit-content;">
                <input type="checkbox" id="noRemind">本设备后续不再提醒
            </label>
            <button id="goMobile" style="padding:8px 22px;background:#4a7c59;color:#fff;border:none;border-radius:6px;font-size:16px">前往移动端页面</button>
        `;
        mask.appendChild(box);
        document.body.appendChild(mask);
    
        // 按钮点击事件
        document.querySelector('#goMobile').onclick = function () {
            const checkbox = document.querySelector('#noRemind');
            if (checkbox.checked) {
                localStorage.setItem('skipMobileTip', 'true');
            }
            // 替换为你的移动端网页地址
            window.location.href = "index mobile.html";
        }
    
        // 禁止点击遮罩关闭弹窗
        mask.onclick = function(e){
            if(e.target === mask) e.stopPropagation();
        }
        }
    });
    </script>
    <script>
    // 1. 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    
    // 2. 禁止选中文字
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
    
    // 3. 拦截快捷键
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+U
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.key === 'u') {
            e.preventDefault();
            return false;
        }
        // Ctrl+s 保存页面（可选拦截）
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
        }
    });
        
    (function() {
        // ========== 配置区 ==========
        const ADMIN_PASSWORD = "WTILI"; 
        const CHECK_INTERVAL = 500;
        let devOpen = false;
        let isAdminVerified = false; // 管理员验证标记，验证通过后不再检测
    
        // 检测开发者工具
        function checkDevTools() {
            if(isAdminVerified) return; // 已经管理员验证，不再检测
    
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            const opened = widthDiff > threshold || heightDiff > threshold;
    
            if(opened && !devOpen){
                devOpen = true;
                // 原生confirm弹窗：确定 / 取消
                const res = confirm("检测到开发者工具已打开，请关闭后继续浏览！");
                if(res){
                    // 点击确定：刷新页面
                    location.reload();
                }else{
                    // 点击取消：请求管理员密码
                    const inputPwd = prompt("请输入管理员密码");
                    if(inputPwd === ADMIN_PASSWORD){
                        // 密码正确：关闭弹窗，停止检测
                        isAdminVerified = true;
                    }else{
                        // 密码错误：刷新页面
                        alert("密码错误");
                    location.reload();
                    }
                }
            }else if(!opened){
                devOpen = false;
            }
        }
    
        // 拦截快捷键 F12 / Ctrl+Shift+I / Ctrl+U
        document.addEventListener("keydown",function(e){
            if(isAdminVerified) return;
            if(e.key === "F12"){
                e.preventDefault();
                checkDevTools();
            }
            if(e.ctrlKey && e.shiftKey && ["I","i"].includes(e.key)){
                e.preventDefault();
                checkDevTools();
            }
            if(e.ctrlKey && ["U","u"].includes(e.key)){
                e.preventDefault();
            }
        })
    
    // 定时循环检测
        setInterval(checkDevTools, CHECK_INTERVAL);
    })();
    </script>
</body>
</html>
